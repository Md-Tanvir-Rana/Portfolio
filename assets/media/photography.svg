<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#030712"/>
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 95 H600 M0 190 H600 M0 285 H600 M150 0 V380 M300 0 V380 M450 0 V380"/>
  </g>

  <circle cx="300" cy="190" r="160" fill="url(#glowGrad)"/>

  <g transform="translate(0, -10)">
    <path d="M240 120 L270 85 L330 85 L360 120 Z" fill="url(#camGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="280" y="72" width="40" height="13" rx="3" fill="#334155" stroke="#64748b" stroke-width="1"/>

    <rect x="150" y="120" width="300" height="170" rx="24" fill="url(#camGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="165" y="135" width="55" height="140" rx="10" fill="#090d16" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
    <rect x="180" y="105" width="28" height="15" rx="4" fill="#38bdf8"/>
    <rect x="380" y="110" width="32" height="10" rx="2" fill="#475569"/>
    <circle cx="205" cy="145" r="5" fill="#ef4444"/>

    <circle cx="320" cy="205" r="70" fill="#090d16" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <circle cx="320" cy="205" r="58" fill="#0b1329" stroke="#0284c7" stroke-width="2"/>
    <circle cx="320" cy="205" r="44" fill="url(#lensGrad)" opacity="0.85"/>
    <path d="M295 180 Q320 165 345 180 Q320 195 295 180 Z" fill="#ffffff" opacity="0.55"/>
    <circle cx="335" cy="195" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="320" cy="205" r="16" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>

    <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8">
      <path d="M290 175 H280 V185"/>
      <path d="M350 175 H360 V185"/>
      <path d="M290 235 H280 V225"/>
      <path d="M350 235 H360 V225"/>
    </g>
  </g>

  <rect x="190" y="325" width="220" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="1"/>
  <text x="300" y="346" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.5">📷 PHOTOGRAPHY &amp; FRAMES</text>
</svg>