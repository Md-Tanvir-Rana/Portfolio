<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.35)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)"/>
    </linearGradient>
    <filter id="glowFash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#030712"/>
  <circle cx="300" cy="180" r="160" fill="url(#purpleGrad)"/>

  <g transform="translate(0, 10)">
    <path d="M220 280 L265 170 L285 220 L300 240 L315 220 L335 170 L380 280 Z" fill="url(#suitGrad)" stroke="#64748b" stroke-width="1.5"/>
    <path d="M265 170 L300 240 L335 170" stroke="#a855f7" stroke-width="2" fill="none"/>
    <polygon points="295,245 305,245 308,285 300,295 292,285" fill="url(#goldGrad)"/>
    <polygon points="340,240 360,225 365,240" fill="#38bdf8"/>

    <g transform="translate(0, -30)">
      <path d="M280 120 Q300 112 320 120" stroke="url(#goldGrad)" stroke-width="4" fill="none"/>
      <line x1="210" y1="115" x2="390" y2="115" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M210 118 L280 118 C285 145 270 170 245 170 C220 170 205 145 210 118 Z" fill="#090d16" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glowFash)"/>
      <path d="M220 125 L245 125 L230 160 Z" fill="rgba(168,85,247,0.3)"/>
      <line x1="220" y1="130" x2="235" y2="155" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>

      <path d="M320 118 L390 118 C395 145 380 170 355 170 C330 170 315 145 320 118 Z" fill="#090d16" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glowFash)"/>
      <path d="M330 125 L355 125 L340 160 Z" fill="rgba(56,189,248,0.3)"/>
      <line x1="330" y1="130" x2="345" y2="155" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    </g>

    <g transform="translate(130, 210)">
      <circle cx="30" cy="30" r="22" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="30" cy="30" r="18" fill="#030712"/>
      <line x1="30" y1="30" x2="30" y2="18" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="38" y2="30" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="2" fill="#ffffff"/>
    </g>
  </g>

  <rect x="180" y="325" width="240" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#a855f7" stroke-width="1"/>
  <text x="300" y="346" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.5">🕶️ FASHION &amp; MODERN STYLE</text>
</svg>