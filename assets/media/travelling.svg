    <polygon points="320,187 360,140 400,187" fill="#38bdf8" opacity="0.6"/>
    <polygon points="160,205 200,160 240,205" fill="#64748b" opacity="0.5"/>

    <polygon points="290,270 298,220 302,220 310,270" fill="#334155"/>
    <line x1="300" y1="220" x2="300" y2="270" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>

    <path d="M80 180 Q220 120 420 85" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>

