      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="travelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.35)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0)"/>
