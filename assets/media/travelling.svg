      <path d="M0 -4 L25 0 L0 4 L-5 12 L-9 12 L-5 4 L-20 4 L-24 9 L-28 9 L-25 0 L-28 -9 L-24 -9 L-20 -4 L-5 -4 L-9 -12 L-5 -12 Z" fill="#ffffff"/>
      <circle cx="-26" cy="0" r="3" fill="#38bdf8"/>
