  <rect x="180" y="325" width="240" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#0284c7" stroke-width="1"/>
  <text x="300" y="346" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.5">✈️ TRAVELLING &amp; EXPLORATION</text>
