<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111d38"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Certificate Canvas Background -->
  <rect width="900" height="600" fill="url(#certBg)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="850" height="550" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="35" y="35" width="830" height="530" rx="6" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Corner Ornaments -->
  <g fill="url(#goldGrad)">
    <polygon points="25,25 65,25 25,65"/>
    <polygon points="875,25 835,25 875,65"/>
    <polygon points="25,575 65,575 25,535"/>
    <polygon points="875,575 835,575 875,535"/>
  </g>

  <!-- Header Institution / Authority -->
  <text x="450" y="95" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="4" text-anchor="middle">NATIONAL TECHNICAL &amp; VOCATIONAL QUALIFICATION</text>
  <text x="450" y="145" fill="url(#goldGrad)" font-family="'Georgia', serif" font-weight="bold" font-size="34" letter-spacing="2" text-anchor="middle">CERTIFICATE OF COMPETENCY</text>
  
  <line x1="300" y1="165" x2="600" y2="165" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="450" cy="165" r="5" fill="#f59e0b"/>

  <text x="450" y="215" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">This is proudly awarded to</text>
  
  <!-- Candidate Name -->
  <text x="450" y="275" fill="#ffffff" font-family="'Georgia', serif" font-weight="bold" font-size="42" letter-spacing="1.5" text-anchor="middle">TANVIR RANA</text>
  <line x1="260" y1="295" x2="640" y2="295" stroke="#38bdf8" stroke-width="2"/>

  <!-- Certification Details -->
  <text x="450" y="340" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">for successfully demonstrating occupational competencies in</text>
  <text x="450" y="385" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="28" letter-spacing="1" text-anchor="middle">IT SUPPORT SERVICES – LEVEL 4</text>
  
  <text x="450" y="420" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">Advanced Hardware Assembly, System Configuration, Network Diagnosis &amp; Troubleshooting</text>

  <!-- Seal / Badge in Center Bottom -->
  <g transform="translate(450, 490)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="0" y="-8" fill="url(#goldGrad)" font-family="'Georgia', serif" font-weight="bold" font-size="12" text-anchor="middle">VERIFIED</text>
    <text x="0" y="10" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">LEVEL 4</text>
    <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">CERTIFIED</text>
  </g>

  <!-- Signatures / Footer -->
  <g transform="translate(160, 500)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="18" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Chief Assessor</text>
    <text x="80" y="32" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">BTEB / NTVQF</text>
  </g>

  <g transform="translate(580, 500)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="18" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Center Director</text>
    <text x="80" y="32" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Authorized Training Org</text>
  </g>
</svg>
