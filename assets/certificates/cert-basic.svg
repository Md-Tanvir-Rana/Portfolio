<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="certBgBasic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#certBgBasic)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="850" height="550" rx="8" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>
  <rect x="35" y="35" width="830" height="530" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Header Institution / Authority -->
  <text x="450" y="95" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="4" text-anchor="middle">VOCATIONAL TRAINING INITIATIVE</text>
  <text x="450" y="145" fill="url(#blueGrad)" font-family="'Georgia', serif" font-weight="bold" font-size="34" letter-spacing="2" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
  
  <line x1="300" y1="165" x2="600" y2="165" stroke="url(#accentGrad)" stroke-width="2"/>
  <circle cx="450" cy="165" r="5" fill="#38bdf8"/>

  <text x="450" y="215" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">This is to certify that</text>
  
  <!-- Candidate Name -->
  <text x="450" y="275" fill="#ffffff" font-family="'Georgia', serif" font-weight="bold" font-size="42" letter-spacing="1.5" text-anchor="middle">TANVIR RANA</text>
  <line x1="260" y1="295" x2="640" y2="295" stroke="#38bdf8" stroke-width="2"/>

  <!-- Certification Details -->
  <text x="450" y="340" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">has successfully completed the comprehensive curriculum in</text>
  <text x="450" y="385" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="28" letter-spacing="1" text-anchor="middle">BASIC COMPUTER TRAINING</text>
  
  <text x="450" y="420" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">Computer Fundamentals, Operating Systems, Office Productivity &amp; Internet Operations</text>

  <!-- Seal / Badge in Center Bottom -->
  <g transform="translate(450, 490)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="0" y="-8" fill="#38bdf8" font-family="'Georgia', serif" font-weight="bold" font-size="12" text-anchor="middle">HONORS</text>
    <text x="0" y="10" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">PASSED</text>
    <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">EXCELLENCE</text>
  </g>

  <!-- Signatures / Footer -->
  <g transform="translate(160, 500)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="18" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Lead Instructor</text>
    <text x="80" y="32" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Computer Training Center</text>
  </g>

  <g transform="translate(580, 500)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="18" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Academic Director</text>
    <text x="80" y="32" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Technical Institute</text>
  </g>
</svg>
