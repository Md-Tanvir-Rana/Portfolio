<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSoho" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131d" />
      <stop offset="100%" stop-color="#0f2137" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bgSoho)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="20" width="310" height="34" rx="6" fill="#0b1727" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="35" y="42" fill="#0ea5e9" font-family="system-ui, sans-serif" font-weight="700" font-size="13">SOHO ROUTER &amp; WI-FI DEPLOYMENT</text>
  <text x="250" y="42" fill="#10b981" font-family="monospace" font-size="11">WPA3 / NAT</text>

  <!-- ISP Cloud -->
  <g transform="translate(100, 160)">
    <ellipse cx="40" cy="30" rx="50" ry="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="40" y="34" fill="#38bdf8" font-family="system-ui" font-weight="700" font-size="12" text-anchor="middle">ISP / WAN</text>
    <text x="40" y="70" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Public IP (PPPoE / DHCP)</text>
  </g>

  <!-- Line to Router -->
  <line x1="190" y1="190" x2="310" y2="190" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="250" y="175" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">Cat6 WAN</text>

  <!-- Wireless Router Center -->
  <g transform="translate(320, 140)">
    <rect x="0" y="30" width="160" height="60" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5"/>
    <!-- Antennas -->
    <line x1="25" y1="30" x2="10" y2="-10" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="80" y1="30" x2="80" y2="-15" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="135" y1="30" x2="150" y2="-10" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Status LEDs -->
    <circle cx="30" cy="60" r="3" fill="#10b981"/>
    <circle cx="50" cy="60" r="3" fill="#10b981"/>
    <circle cx="70" cy="60" r="3" fill="#38bdf8"/>
    <circle cx="90" cy="60" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="60" r="3" fill="#f59e0b"/>
    <text x="80" y="115" fill="#f8fafc" font-family="system-ui" font-weight="700" font-size="13" text-anchor="middle">Dual-Band SOHO Router</text>
    <text x="80" y="132" fill="#0ea5e9" font-family="monospace" font-size="11" text-anchor="middle">192.168.1.1 / Gateway</text>
  </g>

  <!-- Wi-Fi Waves -->
  <path d="M 400 115 A 50 50 0 0 1 450 165" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <path d="M 400 95 A 70 70 0 0 1 470 165" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- LAN Connections -->
  <line x1="480" y1="170" x2="600" y2="120" stroke="#10b981" stroke-width="2.5"/>
  <line x1="480" y1="180" x2="600" y2="200" stroke="#10b981" stroke-width="2.5"/>
  <line x1="480" y1="190" x2="600" y2="280" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Client Devices on Right -->
  <!-- Desktop Workstation -->
  <g transform="translate(610, 100)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#131c31" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui" font-weight="600" font-size="11">Workstation LAN</text>
    <text x="12" y="36" fill="#10b981" font-family="monospace" font-size="10">192.168.1.50 (DHCP)</text>
  </g>

  <!-- Network Attached Storage / Camera -->
  <g transform="translate(610, 180)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#131c31" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui" font-weight="600" font-size="11">Local Server / NAS</text>
    <text x="12" y="36" fill="#10b981" font-family="monospace" font-size="10">Static: 192.168.1.10</text>
  </g>

  <!-- Wi-Fi Clients -->
  <g transform="translate(610, 260)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#131c31" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui" font-weight="600" font-size="11">Wi-Fi (5GHz / WPA3)</text>
    <text x="12" y="36" fill="#38bdf8" font-family="monospace" font-size="10">Laptops &amp; Smartphones</text>
  </g>

  <!-- Security & Feature Highlights Bottom Box -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="680" height="60" rx="8" fill="#131c31" stroke="#1e293b"/>
    <text x="25" y="25" fill="#38bdf8" font-family="system-ui" font-weight="700" font-size="12">Configured Security &amp; Services:</text>
    <text x="25" y="45" fill="#94a3b8" font-family="monospace" font-size="11">DHCP Pool Range (.100-.200) | Port Forwarding (80/443) | SPI Firewall | Guest Wi-Fi Isolation</text>
  </g>
</svg>
