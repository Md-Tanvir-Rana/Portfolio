<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.8" />

  <!-- Network Circuit Lines in Background -->
  <path d="M 60 200 H 120 L 150 170 H 250 L 280 200 H 340" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <path d="M 120 300 L 160 260 H 240 L 280 300" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3" />
  <circle cx="150" cy="170" r="4" fill="#38bdf8" />
  <circle cx="250" cy="170" r="4" fill="#38bdf8" />
  <circle cx="200" cy="80" r="4" fill="#10b981" />

  <!-- Person Silhouette & Tech Gear -->
  <!-- Body/Shoulders -->
  <path d="M 110 340 C 110 275, 145 250, 200 250 C 255 250, 290 275, 290 340 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Shirt Collar / ID Badge Strap -->
  <path d="M 175 255 L 200 290 L 225 255" fill="none" stroke="#38bdf8" stroke-width="3" />
  <!-- Head -->
  <circle cx="200" cy="170" r="55" fill="#334155" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Hair / Cap -->
  <path d="M 145 160 C 145 115, 170 115, 200 115 C 230 115, 255 115, 255 160 C 235 140, 165 140, 145 160 Z" fill="#0f172a" />
  
  <!-- IT Support Headset -->
  <path d="M 140 170 C 140 110, 260 110, 260 170" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <!-- Ear pads -->
  <rect x="134" y="160" width="14" height="30" rx="7" fill="#10b981" />
  <rect x="252" y="160" width="14" height="30" rx="7" fill="#10b981" />
  <!-- Microphone Boom -->
  <path d="M 140 185 Q 155 215 185 210" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <circle cx="188" cy="209" r="6" fill="#38bdf8" filter="url(#glow)" />

  <!-- Network / RJ-45 Badge -->
  <g transform="translate(180, 295)">
    <rect x="0" y="0" width="40" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 10 5 H 30 V 21 H 10 Z" fill="#1e293b" />
    <circle cx="15" cy="13" r="2" fill="#10b981" />
    <circle cx="20" cy="13" r="2" fill="#38bdf8" />
    <circle cx="25" cy="13" r="2" fill="#f59e0b" />
  </g>
</svg>
