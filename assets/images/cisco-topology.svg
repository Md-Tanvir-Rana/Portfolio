<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bgNet)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="250" y1="0" x2="250" y2="450"/>
    <line x1="350" y1="0" x2="350" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="550" y1="0" x2="550" y2="450"/>
    <line x1="650" y1="0" x2="650" y2="450"/>
    <line x1="750" y1="0" x2="750" y2="450"/>
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Title Badge -->
  <rect x="20" y="20" width="280" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="35" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13">CISCO PACKET TRACER LAB</text>
  <text x="215" y="42" fill="#10b981" font-family="monospace" font-size="11">OSPF / VLAN</text>

  <!-- Connection Links (Cables) -->
  <!-- Serial Link R1 to R2 -->
  <line x1="250" y1="160" x2="550" y2="160" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="390" y="145" fill="#ef4444" font-family="monospace" font-size="11" text-anchor="middle">Serial / 10.0.0.0/30</text>
  
  <!-- Gigabit Links R1 to SW1 -->
  <line x1="250" y1="160" x2="160" y2="280" stroke="#10b981" stroke-width="2.5"/>
  <text x="180" y="215" fill="#94a3b8" font-family="monospace" font-size="10">Gi0/0 (Trunk)</text>

  <!-- Gigabit Links R2 to SW2 -->
  <line x1="550" y1="160" x2="640" y2="280" stroke="#10b981" stroke-width="2.5"/>
  <text x="620" y="215" fill="#94a3b8" font-family="monospace" font-size="10">Gi0/0 (Trunk)</text>

  <!-- SW1 to End Devices -->
  <line x1="160" y1="280" x2="90" y2="380" stroke="#38bdf8" stroke-width="2"/>
  <line x1="160" y1="280" x2="230" y2="380" stroke="#38bdf8" stroke-width="2"/>

  <!-- SW2 to End Devices -->
  <line x1="640" y1="280" x2="570" y2="380" stroke="#38bdf8" stroke-width="2"/>
  <line x1="640" y1="280" x2="710" y2="380" stroke="#38bdf8" stroke-width="2"/>

  <!-- ROUTER 1 (R1 - HQ) -->
  <g transform="translate(250, 160)">
    <circle cx="0" cy="0" r="32" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowEffect)"/>
    <path d="M -16 -6 L 16 6 M 16 -6 L -16 6" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-16" cy="-6" r="3" fill="#ffffff"/>
    <circle cx="16" cy="6" r="3" fill="#ffffff"/>
    <circle cx="16" cy="-6" r="3" fill="#ffffff"/>
    <circle cx="-16" cy="6" r="3" fill="#ffffff"/>
    <text x="0" y="-38" fill="#e2e8f0" font-family="system-ui" font-weight="700" font-size="13" text-anchor="middle">R1 (HQ Gateway)</text>
    <text x="0" y="48" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">192.168.10.1</text>
  </g>

  <!-- ROUTER 2 (R2 - Branch) -->
  <g transform="translate(550, 160)">
    <circle cx="0" cy="0" r="32" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowEffect)"/>
    <path d="M -16 -6 L 16 6 M 16 -6 L -16 6" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-16" cy="-6" r="3" fill="#ffffff"/>
    <circle cx="16" cy="6" r="3" fill="#ffffff"/>
    <circle cx="16" cy="-6" r="3" fill="#ffffff"/>
    <circle cx="-16" cy="6" r="3" fill="#ffffff"/>
    <text x="0" y="-38" fill="#e2e8f0" font-family="system-ui" font-weight="700" font-size="13" text-anchor="middle">R2 (Branch Office)</text>
    <text x="0" y="48" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">192.168.20.1</text>
  </g>

  <!-- SWITCH 1 (2960) -->
  <g transform="translate(160, 280)">
    <rect x="-35" y="-15" width="70" height="30" rx="5" fill="#047857" stroke="#10b981" stroke-width="2"/>
    <path d="M -25 -5 H 25 M -25 5 H 25" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="-22" fill="#e2e8f0" font-family="system-ui" font-weight="600" font-size="11" text-anchor="middle">SW-HQ (2960)</text>
    <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">VLAN 10/20</text>
  </g>

  <!-- SWITCH 2 (2960) -->
  <g transform="translate(640, 280)">
    <rect x="-35" y="-15" width="70" height="30" rx="5" fill="#047857" stroke="#10b981" stroke-width="2"/>
    <path d="M -25 -5 H 25 M -25 5 H 25" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="-22" fill="#e2e8f0" font-family="system-ui" font-weight="600" font-size="11" text-anchor="middle">SW-Branch (2960)</text>
    <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">VLAN 30/Servers</text>
  </g>

  <!-- PC 1 -->
  <g transform="translate(90, 380)">
    <rect x="-22" y="-18" width="44" height="30" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-18" y="-14" width="36" height="20" fill="#0f172a"/>
    <rect x="-8" y="12" width="16" height="4" fill="#64748b"/>
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="28" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">PC-HR (VLAN 10)</text>
  </g>

  <!-- PC 2 -->
  <g transform="translate(230, 380)">
    <rect x="-22" y="-18" width="44" height="30" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-18" y="-14" width="36" height="20" fill="#0f172a"/>
    <rect x="-8" y="12" width="16" height="4" fill="#64748b"/>
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="28" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">PC-IT (VLAN 20)</text>
  </g>

  <!-- SERVER 1 -->
  <g transform="translate(570, 380)">
    <rect x="-20" y="-22" width="40" height="36" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="-14" y1="-12" x2="14" y2="-12" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="10" cy="8" r="2" fill="#10b981"/>
    <text x="0" y="28" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">DHCP / DNS</text>
  </g>

  <!-- SERVER 2 -->
  <g transform="translate(710, 380)">
    <rect x="-20" y="-22" width="40" height="36" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="-14" y1="-12" x2="14" y2="-12" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="10" cy="8" r="2" fill="#10b981"/>
    <text x="0" y="28" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Web / Backup</text>
  </g>

  <!-- Protocol Badges at bottom center -->
  <g transform="translate(400, 420)">
    <rect x="-180" y="-14" width="360" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="0" y="2" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Protocol Suite: OSPF Area 0 | 802.1Q Trunk | Standard ACL</text>
  </g>
</svg>
